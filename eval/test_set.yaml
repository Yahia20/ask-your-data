# ============================================================== multi-step
- id: t166
  cat: multistep
  q: ما الموظفون الذين انخفض متوسط تقييم جودتهم في سبتمبر مقارنة بأغسطس؟
  sql: |
    WITH s AS (
      SELECT a.full_name,
             AVG(e.final_score) FILTER (WHERE i.started_at >= '2026-09-01' AND i.started_at < '2026-10-01') AS sep,
             AVG(e.final_score) FILTER (WHERE i.started_at >= '2026-08-01' AND i.started_at < '2026-09-01') AS aug
      FROM agent_evaluations e JOIN interactions i ON i.interaction_id = e.interaction_id JOIN agents a ON a.agent_id = e.agent_id
      WHERE e.contract_status = 'ok' AND e.gradeable AND e.final_score IS NOT NULL AND NOT a.is_bot
      GROUP BY a.full_name)
    SELECT full_name FROM s WHERE sep < aug
- id: t167
  cat: multistep
  q: كم عميلًا تواصل معنا هذا العام ولم تُفتح له أي صفقة؟
