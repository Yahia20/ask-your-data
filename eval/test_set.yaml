- id: t177
  cat: multistep
  q: كم عميلًا جديدًا هذا العام كسبنا معه صفقة خلال أول 30 يومًا من أول تواصل له؟
  sql: |
    SELECT COUNT(DISTINCT c.customer_id) FROM customers c JOIN deals d ON d.customer_id = c.customer_id
    WHERE c.first_seen_at >= '2026-01-01' AND c.first_seen_at < '2026-10-03'
      AND d.stage_semantic = 'S' AND d.close_date <= (c.first_seen_at::date + 30)
- id: t178
  cat: multistep
  q: ما متوسط عدد المحادثات المرتبطة بكل صفقة ناجحة؟
  sql: |
    SELECT AVG(n) FROM (SELECT d.deal_id, COUNT(i.interaction_id) AS n FROM deals d
      JOIN interactions i ON i.deal_id = d.deal_id WHERE d.stage_semantic = 'S' GROUP BY d.deal_id) t
- id: t179
  cat: multistep
  q: أي قناة حققت أعلى مبيعات مقابل كل محادثة هذا العام؟
  sql: |
    WITH r AS (SELECT d.source_channel AS ch, SUM(d.amount) AS rev FROM deals d
               WHERE d.stage_semantic = 'S' AND d.close_date BETWEEN '2026-01-01' AND '2026-10-02' GROUP BY 1),
         n AS (SELECT i.channel AS ch, COUNT(*) AS conv FROM interactions i
               WHERE i.started_at >= '2026-01-01' AND i.started_at < '2026-10-03' GROUP BY 1)
    SELECT r.ch FROM r JOIN n ON n.ch = r.ch ORDER BY r.rev / n.conv DESC LIMIT 1
- id: t180
  cat: multistep
  q: كم صفقة ناجحة فازت بها سارة القحطاني من عملاء تواصلوا عبر إنستغرام هذا العام؟
  sql: |
