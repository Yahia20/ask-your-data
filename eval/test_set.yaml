  cat: multistep
  q: كم الفرق بين مبيعات صيف 2026 ومبيعات رمضان؟
  sql: |
    SELECT SUM(d.amount) FILTER (WHERE d.close_date BETWEEN '2026-06-01' AND '2026-08-31')
