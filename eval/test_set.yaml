- id: t168
  cat: multistep
  q: ما نسبة العملاء الذين تواصلوا معنا هذا العام وكسبنا معهم صفقة واحدة على الأقل؟
  sql: |
    SELECT 100.0 * COUNT(DISTINCT i.customer_id) FILTER (WHERE EXISTS (
             SELECT 1 FROM deals d WHERE d.customer_id = i.customer_id AND d.stage_semantic = 'S'))
           / COUNT(DISTINCT i.customer_id)
    FROM interactions i WHERE i.started_at >= '2026-01-01' AND i.started_at < '2026-10-03'
- id: t169
  cat: multistep
  q: ما متوسط وقت أول رد بالدقائق في المحادثات المرتبطة بصفقات ناجحة مقارنة بالصفقات الخاسرة؟
  sql: |
    SELECT d.stage_semantic, AVG(i.first_response_seconds) / 60.0 FROM interactions i JOIN deals d ON d.deal_id = i.deal_id
    WHERE NOT i.is_bot_handled AND d.stage_semantic IN ('S', 'F') GROUP BY d.stage_semantic
- id: t170
  cat: multistep
  q: أي وجهة لديها أعلى متوسط ميزانية بالريال؟
  sql: |
    SELECT d.canonical_name FROM interaction_analysis ia
    JOIN interaction_destinations x ON x.analysis_id = ia.analysis_id AND x.role = 'destination'
    JOIN destinations d ON d.destination_id = x.destination_id
    WHERE ia.budget_currency = 'SAR' GROUP BY d.canonical_name ORDER BY AVG(ia.budget_amount) DESC LIMIT 1
- id: t171
  cat: multistep
  q: كم محادثة طلب فيها العميل إسطنبول وطرابزون معًا؟
  sql: |
    SELECT COUNT(*) FROM interaction_analysis ia
    WHERE EXISTS (SELECT 1 FROM interaction_destinations x JOIN destinations d ON d.destination_id = x.destination_id
                  WHERE x.analysis_id = ia.analysis_id AND x.role = 'destination' AND d.canonical_name = 'Istanbul')
      AND EXISTS (SELECT 1 FROM interaction_destinations x JOIN destinations d ON d.destination_id = x.destination_id
                  WHERE x.analysis_id = ia.analysis_id AND x.role = 'destination' AND d.canonical_name = 'Trabzon')
- id: t172
  cat: multistep
  q: من الموظف صاحب أعلى مبيعات بين الموظفين الذين يزيد متوسط تقييم جودتهم عن 75؟
  sql: |
    WITH q AS (
      SELECT e.agent_id FROM agent_evaluations e JOIN agents a ON a.agent_id = e.agent_id
      WHERE e.contract_status = 'ok' AND e.gradeable AND e.final_score IS NOT NULL AND NOT a.is_bot
      GROUP BY e.agent_id HAVING AVG(e.final_score) > 75)
    SELECT a.full_name FROM deals d JOIN agents a ON a.agent_id = d.agent_id
    WHERE d.stage_semantic = 'S' AND d.agent_id IN (SELECT agent_id FROM q)
    GROUP BY a.full_name ORDER BY SUM(d.amount) DESC LIMIT 1
- id: t173
  cat: multistep
  q: اعرض لكل موظف نسبة الالتزام بالمتابعة ومتوسط تقييم جودته.
  sql: |
    WITH f AS (
      SELECT f.agent_id, 100.0 * COUNT(*) FILTER (WHERE f.status = 'fulfilled') / COUNT(*) FILTER (WHERE f.status IN ('fulfilled', 'late', 'missed')) AS kept
      FROM follow_ups f GROUP BY f.agent_id),
    q AS (
      SELECT e.agent_id, AVG(e.final_score) AS score FROM agent_evaluations e
      WHERE e.contract_status = 'ok' AND e.gradeable AND e.final_score IS NOT NULL GROUP BY e.agent_id)
    SELECT a.full_name, f.kept, q.score FROM agents a JOIN f ON f.agent_id = a.agent_id JOIN q ON q.agent_id = a.agent_id
    WHERE NOT a.is_bot
