# DEV SET - for tuning prompts and the semantic layer. Different questions from
# test_set.yaml. Same conventions: today 2026-10-02, Asia/Riyadh, week starts Sunday.

- id: d01
  cat: msa
  q: كم محادثة وصلتنا عبر فيسبوك في يوليو؟
  sql: SELECT COUNT(*) FROM interactions i WHERE i.channel = 'facebook' AND i.started_at >= '2026-07-01' AND i.started_at < '2026-08-01'
- id: d02
  cat: msa
  q: ما متوسط وقت أول رد بالدقائق في محادثات تيليجرام؟
  sql: SELECT AVG(i.first_response_seconds) / 60.0 FROM interactions i WHERE NOT i.is_bot_handled AND i.channel = 'telegram'
- id: d03
  cat: msa
  q: ما المبيعات حسب القناة في الربع الثاني؟
  sql: |
    SELECT d.source_channel, SUM(d.amount) FROM deals d
    WHERE d.stage_semantic = 'S' AND d.close_date BETWEEN '2026-04-01' AND '2026-06-30' GROUP BY d.source_channel
- id: d04
  cat: msa
  q: من الموظف الذي أغلق أكبر عدد من الصفقات الناجحة في الشهر الماضي؟
  sql: |
    SELECT a.full_name FROM deals d JOIN agents a ON a.agent_id = d.agent_id
    WHERE d.stage_semantic = 'S' AND d.close_date BETWEEN '2026-09-01' AND '2026-09-30'
    GROUP BY a.full_name ORDER BY COUNT(*) DESC LIMIT 1
- id: d05
  cat: msa
  q: ما متوسط درجة تقديم العرض لكل موظف هذا العام؟
  sql: |
    SELECT a.full_name, AVG(e.m2_offer) FROM agent_evaluations e
    JOIN interactions i ON i.interaction_id = e.interaction_id JOIN agents a ON a.agent_id = e.agent_id
    WHERE e.contract_status = 'ok' AND e.gradeable AND e.final_score IS NOT NULL AND NOT a.is_bot
      AND i.started_at >= '2026-01-01' AND i.started_at < '2026-10-03'
    GROUP BY a.full_name
- id: d06
  cat: msa
  q: كم عدد العملاء الجدد من القاهرة هذا العام؟
  sql: SELECT COUNT(*) FROM customers c WHERE c.residence_city = 'Cairo' AND c.first_seen_at >= '2026-01-01' AND c.first_seen_at < '2026-10-03'
- id: d07
  cat: msa
  q: ما نسبة المحادثات التي بدأت خارج الدوام في الشهر الماضي؟
  sql: SELECT 100.0 * COUNT(*) FILTER (WHERE i.is_after_hours) / COUNT(*) FROM interactions i WHERE i.started_at >= '2026-09-01' AND i.started_at < '2026-10-01'
- id: d08
  cat: msa
  q: كم عدد المحادثات التي طلب فيها العملاء باكو في الربع الثاني؟
  sql: |
    SELECT COUNT(DISTINCT i.interaction_id) FROM interactions i
    JOIN interaction_analysis ia ON ia.interaction_id = i.interaction_id
    JOIN interaction_destinations x ON x.analysis_id = ia.analysis_id AND x.role = 'destination'
    JOIN destinations d ON d.destination_id = x.destination_id
    WHERE d.canonical_name = 'Baku' AND i.started_at >= '2026-04-01' AND i.started_at < '2026-07-01'
- id: d09
  cat: msa
  q: ما قيمة الصفقات المفتوحة لكل موظف؟
  sql: SELECT a.full_name, SUM(d.amount) FROM deals d JOIN agents a ON a.agent_id = d.agent_id WHERE d.stage_semantic = 'P' GROUP BY a.full_name
- id: d10
  cat: msa
  q: كم صفقة فندقية خسرناها هذا العام؟
  sql: SELECT COUNT(*) FROM deals d WHERE d.stage_semantic = 'F' AND d.service = 'hotel' AND d.close_date BETWEEN '2026-01-01' AND '2026-10-02'
- id: d11
  cat: msa
  q: ما عدد التقييمات الممتازة لكل موظف في الربع الثالث؟
  sql: |
    SELECT a.full_name, COUNT(*) FROM agent_evaluations e
    JOIN interactions i ON i.interaction_id = e.interaction_id JOIN agents a ON a.agent_id = e.agent_id
    WHERE e.contract_status = 'ok' AND e.gradeable AND e.final_score IS NOT NULL AND NOT a.is_bot
      AND e.performance_level = 'Excellent' AND i.started_at >= '2026-07-01' AND i.started_at < '2026-10-01'
    GROUP BY a.full_name
- id: d12
  cat: msa
  q: ما عدد وعود المتابعة لكل قناة هذا العام؟
  sql: SELECT f.channel, COUNT(*) FROM follow_ups f WHERE f.promised_at >= '2026-01-01' AND f.promised_at < '2026-10-03' GROUP BY f.channel
- id: d13
  cat: msa
  q: ما متوسط الميزانية بالريال للعملاء الساخنين؟
  sql: |
    SELECT AVG(ia.budget_amount) FROM interaction_analysis ia
    WHERE ia.lead_temp = 'hot' AND ia.budget_currency = 'SAR'
- id: d14
  cat: msa
  q: كم عدد المحادثات الأسبوعية في سبتمبر؟
  sql: |
    SELECT date_trunc('week', i.started_at)::date, COUNT(*) FROM interactions i
    WHERE i.started_at >= '2026-09-01' AND i.started_at < '2026-10-01' GROUP BY 1
- id: d15
  cat: msa
  q: قارن المبيعات في يونيو بالمبيعات في مايو.
  sql: |
    SELECT SUM(d.amount) FILTER (WHERE d.close_date BETWEEN '2026-06-01' AND '2026-06-30'),
           SUM(d.amount) FILTER (WHERE d.close_date BETWEEN '2026-05-01' AND '2026-05-31')
    FROM deals d WHERE d.stage_semantic = 'S'
- id: d16
  cat: msa
  q: ما نسبة الالتزام بالمتابعة لفريق خدمة العملاء؟
  sql: |
    SELECT 100.0 * COUNT(*) FILTER (WHERE f.status = 'fulfilled') / COUNT(*) FILTER (WHERE f.status IN ('fulfilled', 'late', 'missed'))
    FROM follow_ups f JOIN agents a ON a.agent_id = f.agent_id WHERE a.team = 'support'
- id: d17
  cat: msa
  q: كم محادثة كانت شكوى في الشهر الماضي؟
  sql: |
    SELECT COUNT(*) FROM interactions i JOIN interaction_analysis ia ON ia.interaction_id = i.interaction_id
    WHERE ia.intent = 'complaint' AND i.started_at >= '2026-09-01' AND i.started_at < '2026-10-01'
- id: d18
  cat: msa
  q: كم عميلًا كويتيًا لدينا؟
  sql: SELECT COUNT(*) FROM customers c WHERE c.nationality = 'Kuwaiti'
- id: d19
