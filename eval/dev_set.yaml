- id: d46
  cat: multistep
  q: من هم الموظفون الذين مبيعاتهم في الربع الثالث أعلى من الربع الثاني؟
  sql: |
    WITH s AS (
      SELECT a.full_name,
             SUM(d.amount) FILTER (WHERE d.close_date BETWEEN '2026-07-01' AND '2026-09-30') AS q3,
             SUM(d.amount) FILTER (WHERE d.close_date BETWEEN '2026-04-01' AND '2026-06-30') AS q2
      FROM deals d JOIN agents a ON a.agent_id = d.agent_id WHERE d.stage_semantic = 'S' GROUP BY a.full_name)
    SELECT full_name FROM s WHERE q3 > q2
- id: d47
  cat: multistep
  q: كم عميلًا لديه أكثر من 5 محادثات هذا العام؟
  sql: |
    SELECT COUNT(*) FROM (SELECT i.customer_id FROM interactions i
      WHERE i.started_at >= '2026-01-01' AND i.started_at < '2026-10-03' GROUP BY i.customer_id HAVING COUNT(*) > 5) t
- id: d48
  cat: multistep
  q: ما متوسط قيمة الصفقات الناجحة للعملاء السعوديين مقارنة بالمصريين؟
  sql: |
    SELECT c.nationality, AVG(d.amount) FROM deals d JOIN customers c ON c.customer_id = d.customer_id
    WHERE d.stage_semantic = 'S' AND c.nationality IN ('Saudi', 'Egyptian') GROUP BY c.nationality
- id: d49
  cat: multistep
  q: كم محادثة ساخنة لم تتحول إلى أي صفقة هذا العام؟
  sql: |
    SELECT COUNT(*) FROM interactions i JOIN interaction_analysis ia ON ia.interaction_id = i.interaction_id
    WHERE ia.lead_temp = 'hot' AND i.deal_id IS NULL AND i.started_at >= '2026-01-01' AND i.started_at < '2026-10-03'
- id: d50
  cat: multistep
  q: ما أكثر وجهة يطلبها العملاء المصريون؟
  sql: |
    SELECT d.canonical_name FROM interactions i JOIN customers c ON c.customer_id = i.customer_id
    JOIN interaction_analysis ia ON ia.interaction_id = i.interaction_id
    JOIN interaction_destinations x ON x.analysis_id = ia.analysis_id AND x.role = 'destination'
    JOIN destinations d ON d.destination_id = x.destination_id
    WHERE c.nationality = 'Egyptian' GROUP BY d.canonical_name ORDER BY COUNT(DISTINCT i.interaction_id) DESC LIMIT 1

