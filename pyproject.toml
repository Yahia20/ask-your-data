[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ask-your-data"
version = "0.1.0"
description = "Ask a CRM/conversation warehouse questions in Arabic (MSA or Saudi dialect) and get numbers you can trust"
requires-python = ">=3.10"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
